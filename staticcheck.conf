# staticcheck configuration — Project Pragya Go backend.
#
# ST1005 ("error strings should not be capitalized / should not end with
# punctuation") is disabled deliberately and must stay disabled.
#
# Almost every error value in this codebase is not a Go-idiomatic internal
# error: it is user-facing contract text copied byte-for-byte from the Python
# backend and asserted against captured golden responses. For example
# internal/geo returns
#
#     "Outer ring must have at least 4 coordinate pairs (3 unique + 1 closing)."
#
# which the React frontend renders directly. Rewording it to satisfy the linter
# would break PRD §0.1 (the HTTP contract is frozen) and fail the contract
# suite. See internal/geo/geo_test.go, which diffs these strings against
# testdata/golden/.
checks = ["all", "-ST1005"]
